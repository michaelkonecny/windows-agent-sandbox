[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sbx"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["click>=8.0"]

[project.optional-dependencies]
# pyte is a terminal emulator: it turns the pseudoconsole's VT byte
# stream into a screen buffer so tests can assert on what was rendered.
test = ["pytest>=8.0", "pyte>=0.8"]

[project.scripts]
sbx = "sbx.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "elevation: needs admin privileges",
    "integration: needs Windows APIs or system changes",
    "system: drives the CLI through a pseudoconsole, end to end",
]
