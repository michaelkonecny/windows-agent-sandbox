[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sbx"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["click>=8.0"]

[project.scripts]
sbx = "sbx.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "elevation: needs admin privileges",
    "integration: needs Windows APIs or system changes",
    "system: black-box test of the installed tool (tests/system, opt-in via SBX_SYSTEM_TESTS=1)",
]
